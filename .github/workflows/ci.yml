# CI — verificação automática a cada push e pull request.
# Roda: instalação, checagem de tipos, lint e testes (inclui os golden
# tests obrigatórios do Calculations.md §11 — se um quebrar, o CI falha).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Permite disparar a verificação à mão, pelo botão "Run workflow" na aba
  # Actions. Útil quando o que mudou não foi o código e sim a configuração —
  # trocar um segredo, por exemplo, não gera commit nenhum e portanto não
  # dispara nada.
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos (TypeScript)
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Instalar Chromium para E2E
        run: npx playwright install --with-deps chromium

      # Os testes de tela sobem o app e abrem um navegador de verdade.
      #
      # Os públicos (tela de login) rodam sempre. Os que exigem entrar no
      # sistema só rodam se os quatro segredos abaixo existirem no
      # repositório — sem eles o teste se pula sozinho, e o CI continua
      # verde. Ver docs/06-Carga-e-Deploy.md §5.3.
      #
      # VITE_* apontam o app para o Supabase real; sem eles o navegador
      # não tem banco para autenticar. A chave é a publicável, a mesma que
      # já vai no navegador de qualquer visitante — não é segredo de
      # verdade, mas fica no cofre para não nascer escrita no repositório.
      - name: Smoke tests E2E
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Guardar evidência de falha de tela
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
